name: Deploy web
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      CI_IMAGE: solaris-ci:latest
    steps:
      - name: Clean workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}" 2>/dev/null || true
          rm -rf doc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          token: ${{ secrets.CI_GH_TOKEN }}

      - name: Fetch SPP submodule
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          git config --global url."https://x-access-token:${{ secrets.CI_GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.CI_GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1 solaris-v2/spp

      - name: Build docs site (Doxygen)
        run: |
          docker image inspect "$CI_IMAGE" >/dev/null 2>&1 \
            || docker build -f .github/Dockerfile.ci -t "$CI_IMAGE" .
          mkdir -p doc
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --security-opt label=disable \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "$CI_IMAGE" \
            bash -c 'doxygen Doxyfile'

      - name: Publish to server
        run: |
          rsync -av --delete doc/html/ "/home/solaris/solaris-web/html/"
